name: Implementation proposal
description: Propose an outcome for triage and later promotion to scoped implementation.
labels:
  - enhancement
  - status:triage
body:
  - type: markdown
    attributes:
      value: |
        Start with the issue; a delivery packet is not required at intake. Once non-trivial work is accepted and its
        design is resolved, add a small repository-local packet containing scope, acceptance, targeted context, and
        validation, then move the issue to status:ready. Tiny obvious fixes may remain packet-free.
  - type: input
    id: outcome
    attributes:
      label: Outcome
      description: One sentence describing the independently valuable result.
      placeholder: Users can...
    validations:
      required: true
  - type: input
    id: packet
    attributes:
      label: Delivery packet
      description: Add after acceptance when the work benefits from a repository-local implementation brief.
      placeholder: docs/iterations/I123-short-name.md (issue #123)
  - type: textarea
    id: coordination
    attributes:
      label: Coordination context
      description: Evidence, open decisions, or collaboration context needed during triage.
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies or blockers
      description: Link blocking or blocked issues instead of copying their contents.
